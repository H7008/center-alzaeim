<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الألعاب - مركز الزعيم</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #101522;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container { max-width: 1100px; margin: auto; }

    h1 { color: #d6a735; text-align: center; }

    .subtitle { text-align: center; color: #bbb; }

    .panel {
      background: #202a3b;
      padding: 18px;
      border-radius: 12px;
      margin: 20px 0;
    }

    input, select, button {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #555;
      font-size: 15px;
      margin: 5px 0;
    }

    input, select {
      background: #101522;
      color: white;
    }

    button {
      background: #d6a735;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    .hidden { display: none; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }

    .toolbar input { flex: 1; min-width: 180px; }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 15px;
    }

    .game {
      background: #202a3b;
      border: 1px solid #3b4658;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }

    .game img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: contain;
      background: #101522;
      border-radius: 6px;
    }

    .game input, .game select { width: 100%; }

    .status {
      text-align: center;
      color: #d6a735;
      margin: 15px 0;
    }

    #loginPanel { max-width: 450px; margin: 30px auto; }

    #loginPanel input { width: 100%; }
  </style>
</head>
<body>

<div class="container">
  <h1>مركز الزعيم</h1>
  <p class="subtitle">لوحة إدارة مكتبة الألعاب</p>

  <section id="loginPanel" class="panel">
    <h3>تسجيل دخول الإدارة</h3>
    <input id="email" type="email" placeholder="البريد الإلكتروني">
    <input id="password" type="password" placeholder="كلمة المرور">
    <button id="loginButton">تسجيل الدخول</button>
    <p id="loginStatus" class="status"></p>
  </section>

  <section id="adminPanel" class="hidden">
    <div class="toolbar">
      <input id="search" placeholder="ابحث عن لعبة...">
      <button id="addButton">إضافة لعبة جديدة</button>
      <button id="logoutButton">تسجيل الخروج</button>
    </div>

    <div id="addPanel" class="panel hidden">
      <h3>إضافة لعبة</h3>
      <input id="newName" placeholder="اسم اللعبة">
      <select id="newPlatform">
        <option value="">اختر الجهاز</option>
        <option value="ps2">PS2</option>
        <option value="ps4">PS4</option>
        <option value="ps5">PS5</option>
      </select>
      <input id="newImage" type="file" accept="image/*">
      <button id="saveNewButton">حفظ اللعبة</button>
    </div>

    <p class="status" id="status">جاري تحميل الألعاب...</p>
    <div class="games" id="games"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="admin.js"></script>

</body>
</html>
